name: Setup problem
description: Installing the tools, opening the course, or running an academy command fails.
labels: ["setup"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: academy health
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Paste everything the terminal printed. Remove any personal paths or tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of academy health
      description: Run academy health in your module folder and paste everything it printed. Skip this if academy is not installed yet.
      render: text
  - type: textarea
    id: tried
    attributes:
      label: What you tried
