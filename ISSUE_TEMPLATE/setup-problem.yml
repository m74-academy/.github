name: Setup problem
description: Installing the tools, opening the course, or running uv run academy fails.
labels: ["setup"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: uv run academy --help
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Paste everything the terminal printed. Remove any personal paths or tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
